<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghostface Xbox Preview</title>
<!--
  Local preview of scream_ghostface_xbox.css with the same HTML structure as
  the Xbox skin of gamepadviewer.com. Plug in a controller, or use the keyboard:
    A B X Y   -> J L H K        LB / RB -> Q / E      LT / RT -> 1 / 3
    D-pad     -> arrow keys     View / Menu -> V / M  Guide -> G
    Sticks    -> WASD (left), IJKL with Shift (right), LS / RS click -> Z / C
-->
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font: 13px system-ui, sans-serif; color: #bbb; }
  .controller { position: absolute; left: 50%; top: 50%; }
  .hint { position: fixed; left: 12px; bottom: 10px; opacity: .7; }
</style>
<link rel="stylesheet" href="scream_ghostface_xbox.css">
<style>
  /* Use the local copy of the image when it sits next to this file. */
  .controller.xbox { --shell: url("ghostface_raiju_shell.png"); }
</style>
</head>
<body>
<div class="controller xbox" id="pad">
  <div class="triggers">
    <span class="trigger left" data-button="6"></span>
    <span class="trigger right" data-button="7"></span>
  </div>
  <div class="bumpers">
    <span class="bumper left" data-button="4"></span>
    <span class="bumper right" data-button="5"></span>
  </div>
  <div class="quadrant p0"></div>
  <div class="arrows">
    <span class="back" data-button="8"></span>
    <span class="start" data-button="9"></span>
    <span class="meta" data-button="16"></span>
  </div>
  <div class="abxy">
    <span class="button a" data-button="0"></span>
    <span class="button b" data-button="1"></span>
    <span class="button x" data-button="2"></span>
    <span class="button y" data-button="3"></span>
  </div>
  <div class="sticks">
    <span class="stick left" data-button="10"></span>
    <span class="stick right" data-button="11"></span>
  </div>
  <div class="dpad">
    <span class="face up" data-button="12"></span>
    <span class="face down" data-button="13"></span>
    <span class="face left" data-button="14"></span>
    <span class="face right" data-button="15"></span>
  </div>
</div>
<div class="hint">Manette ou clavier : JLHK = A B X Y · Q/E = LB/RB · 1/3 = LT/RT · flèches = croix · V/M/G · WASD + Shift = sticks · Z/C = clic stick</div>
<script>
  const keyMap = { j: 0, l: 1, h: 2, k: 3, q: 4, e: 5, '1': 6, '3': 7, v: 8, m: 9, z: 10, c: 11,
    arrowup: 12, arrowdown: 13, arrowleft: 14, arrowright: 15, g: 16 };
  const held = new Set();
  const stickKeys = { w: [1, -1], s: [1, 1], a: [0, -1], d: [0, 1] };
  addEventListener('keydown', e => { held.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup', e => held.delete(e.key.toLowerCase()));
  addEventListener('blur', () => held.clear());

  const btn = i => document.querySelector(`[data-button="${i}"]`);

  function render(buttons, axes) {
    buttons.forEach((value, i) => {
      const el = btn(i);
      if (!el) return;
      if (el.classList.contains('trigger')) el.style.opacity = value;
      else el.classList.toggle('pressed', value > 0.5);
    });
    [['left', 0], ['right', 2]].forEach(([side, o]) => {
      const el = document.querySelector('.stick.' + side);
      const x = axes[o] || 0, y = axes[o + 1] || 0;
      el.style.marginLeft = x * 25 + 'px';
      el.style.marginTop = y * 25 + 'px';
      el.style.transform = `rotateX(${-y * 30}deg) rotateY(${x * 30}deg)`;
    });
  }

  function loop() {
    const pad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
    if (pad) {
      render(pad.buttons.map(b => b.value || (b.pressed ? 1 : 0)), pad.axes);
    } else {
      const buttons = Array(17).fill(0);
      for (const [k, i] of Object.entries(keyMap)) if (held.has(k)) buttons[i] = 1;
      const axes = [0, 0, 0, 0];
      const off = held.has('shift') ? 2 : 0;
      for (const [k, [a, v]] of Object.entries(stickKeys)) if (held.has(k)) axes[a + off] += v;
      render(buttons, axes);
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
